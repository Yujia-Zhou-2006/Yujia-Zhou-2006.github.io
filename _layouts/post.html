---
layout: default
---
<article class="markdown-body">
  <header class="mb-3 fade-layer-0">
    <h1 class="f2-light">{{ page.title }}</h1>
    <p class="color-fg-muted">{{ page.date | date: "%Y-%m-%d" }}{% if page.tags %} — {{ page.tags | join: ", " }}{% endif %}</p>
  </header>
  <div class="fade-layer-1">
    {{ content }}
  </div>
</article>
